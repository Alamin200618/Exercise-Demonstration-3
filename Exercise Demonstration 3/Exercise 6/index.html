<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6 - Combined Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="title-banner">
            <h1>Exercise 6: Interactive Visualizations</h1>
            <p class="subtitle">Histogram & Scatterplot Dashboard</p>
        </div>

        <div id="filters" class="filters-container"></div>


        <div class="charts-grid">
            <div class="chart-card">
                <h2>6.1 Histogram: Energy Consumption</h2>
                <div id="histogram" class="chart-container"></div>
            </div>
            <div class="chart-card">
                <h2>6.2 Scatterplot: Star Rating vs Energy</h2>
                <div id="scatterplot" class="chart-container"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="js/histogram.js"></script>
    <script src="js/scatterplot.js"></script>
</body>
</html>
